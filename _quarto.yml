project:
  type: book

engine: jupyter
jupyter: pymc6

book:
  sidebar:
    style: docked
  title: "Reinforcement Learning with Pytensor"
  author:
    - "Jonathan Dekermanjian"
  date: today
  chapters:
    - index.qmd
    - part: "Tabular Solution Methods"
      chapters:
        - chapters/bandits.qmd
        - chapters/markov_decision_processes.qmd
        - chapters/dynamic_programming.qmd
        - chapters/monte_carlo_methods.qmd
        - chapters/temporal-difference_learning.qmd
        - chapters/n_step_bootstrapping.qmd
        - chapters/planning_and_learning_with_tabular_methods.qmd

format:
  html:
    number-sections: false
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"
    theme:
      light:
        - cosmo
        - light.scss
      dark:
        - cosmo
        - dark.scss
    grid:
      body-width: 1000px
      sidebar-width: 250px
      margin-width: 200px
